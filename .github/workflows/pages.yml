# Publica o build Flutter no GitHub Pages.
#
# Substitui o construtor "legacy" do Pages, que passou a falhar sem explicacao
# em 06/08/2026 ("Page build failed", duracao 0, quatro tentativas seguidas,
# com o repositorio intacto). Este caminho da log de erro de verdade.
#
# O deploy_web.ps1 nao muda: ele continua fazendo push nesta branch, e este
# workflow publica o conteudo como esta (sem Jekyll).
#
# ----------------------------------------------------------------------------
# 25/11/2026 -- POR QUE v5 E NAO O PAR v3+v4 QUE ESTAVA AQUI
#
# Em 25/11 falharam QUATRO publicacoes seguidas, sempre com:
#   "No artifacts named github-pages were found for this workflow run"
# ...logo depois de o proprio passo anterior dizer:
#   "Artifact github-pages has been successfully uploaded! Artifact ID is ..."
#
# O que NAO era, medido e descartado:
#  - nao era a disputa entre o `push` e o `workflow_dispatch` que o
#    deploy_web.ps1 faz (o CLAUDE.md suspeitava disso): uma corrida SOZINHA,
#    disparada a mao, falhou igual;
#  - nao era consistencia eventual da API: pus um passo que esperava o artefato
#    aparecer em `/actions/runs/<id>/artifacts` e ele apareceu na PRIMEIRA
#    tentativa, 0,4 s depois do upload -- e o deploy-pages, logo em seguida,
#    continuou dizendo que nao existia. O passo foi removido junto com esta
#    nota, porque guardar protecao construida sobre teoria errada e pior do
#    que nao ter nenhuma.
#
# O que ERA: a quebra do Node 20 -> 24. O aviso da propria corrida nomeia
# `upload-artifact@v4` e `deploy-pages@v4` como "forced to run on Node.js 24",
# e o GitHub chegou a publicar uma tag `deploy-pages v3.0.2-node.24` so para
# isso. O artefato passou a ser GRAVADO por um backend e PROCURADO por outro.
#
# O par novo resolve na raiz: `upload-pages-artifact@v5` usa
# `upload-artifact@v7` por dentro, e `deploy-pages@v5` roda em `node24`
# nativo (`using: 'node24'` no action.yml dele), em vez de ser forcado.
#
# As entradas e saidas sao as mesmas (`path`, `name`, `page_url`), entao a
# troca e so de versao.
#
# NAO mexido de proposito: `checkout@v4` e `configure-pages@v5` aparecem no
# mesmo aviso de Node 20, mas nao falharam. Bumpar quatro acoes de uma vez
# tornaria a proxima falha dificil de atribuir.
# ----------------------------------------------------------------------------
name: Publicar no Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicacao por vez; nao cancela a que ja esta rodando.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Empacotar o site
        uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v5
