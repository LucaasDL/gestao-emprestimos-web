# Publica o build Flutter no GitHub Pages.
#
# Substitui o construtor "legacy" do Pages, que passou a falhar sem explicacao
# em 06/08/2026 ("Page build failed", duracao 0, quatro tentativas seguidas,
# com o repositorio intacto). Este caminho da log de erro de verdade.
#
# O deploy_web.ps1 nao muda: ele continua fazendo push nesta branch, e este
# workflow publica o conteudo como esta (sem Jekyll).
name: Publicar no Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicacao por vez; nao cancela a que ja esta rodando.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Empacotar o site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v4
