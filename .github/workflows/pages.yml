# Publica o build Flutter no GitHub Pages.
#
# Substitui o construtor "legacy" do Pages, que passou a falhar sem explicacao
# em 06/08/2026 ("Page build failed", duracao 0, quatro tentativas seguidas,
# com o repositorio intacto). Este caminho da log de erro de verdade.
#
# O deploy_web.ps1 nao muda: ele continua fazendo push nesta branch, e este
# workflow publica o conteudo como esta (sem Jekyll).
name: Publicar no Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # Para o passo de espera abaixo poder listar os artefatos da propria corrida.
  actions: read

# Uma publicacao por vez; nao cancela a que ja esta rodando.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Empacotar o site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      # O `deploy-pages` pede os metadados do artefato a API e falha NA HORA se
      # ela ainda nao o enxerga -- ele nao tenta de novo nesse caso.
      #
      # Medido em 25/11/2026, na corrida 45713683868:
      #   22:29:57.75  "Artifact github-pages has been successfully uploaded!
      #                 ... Artifact ID is 15067734475"
      #   22:29:58.50  "No artifacts named github-pages were found"
      # 0,75 s entre gravar e nao achar. E consistencia eventual da API, e e
      # isso que explica a intermitencia: as corridas que passavam levavam
      # 31-72 s e as que falhavam, 18-20 s. Em 25/11 falharam QUATRO seguidas,
      # inclusive uma sozinha -- entao nao era a disputa entre o push e o
      # workflow_dispatch que o CLAUDE.md suspeitava.
      #
      # Esperar e barato quando a API esta rapida (sai na 1a volta) e paciente
      # quando nao esta. Falha ALTO depois de 150 s, em vez de publicar nada e
      # deixar o site velho no ar sem aviso.
      - name: Esperar o artefato aparecer na API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 30); do
            n=$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
              --jq '[.artifacts[] | select(.name == "github-pages")] | length')
            if [ "$n" -ge 1 ]; then
              echo "artefato visivel na API na tentativa $i"
              exit 0
            fi
            echo "ainda nao visivel (tentativa $i), esperando 5s..."
            sleep 5
          done
          echo "::error::o artefato github-pages nao apareceu na API em 150s"
          exit 1

      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v4
